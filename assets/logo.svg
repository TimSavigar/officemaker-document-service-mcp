<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" ry="16" fill="#1a365d"/>

  <g font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="white" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="32" fill="none" stroke="#00ffff" stroke-width="0.3" filter="url(#glow)">OM</text>
    <text x="32" y="32" fill="none" stroke="#ff0000" stroke-width="0.3" transform="translate(0.2, 0.2)">OM</text>
    <text x="32" y="32" fill="white">OM</text>
  </g>
</svg>
